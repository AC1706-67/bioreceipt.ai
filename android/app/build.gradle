plugins {
  id "com.android.application"
  id "com.facebook.react"
  id "org.jetbrains.kotlin.android"
}

android {
  namespace "com.bioreceipt.ai"
  compileSdk 35

  defaultConfig {
    applicationId "com.bioreceipt.ai"
    minSdkVersion 24
    targetSdkVersion 35
    versionCode 1
    versionName "1.0"
  }

  // Java 17 for both Java & Kotlin
  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }
  kotlinOptions { jvmTarget = "17" }

  buildTypes {
    debug {
      // Removed applicationIdSuffix to match React Native CLI expectations
    }
    release {
      minifyEnabled false
      proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
    }
  }
}

dependencies {
  // React Native core
  implementation("com.facebook.react:react-android:0.80.2")
  implementation("com.facebook.react:hermes-android:0.80.2")

  // --- Explicitly add the autolinked libraries so PackageList compiles ---
  implementation(project(":react-native-async-storage_async-storage"))
  implementation(project(":react-native-community_netinfo"))
  implementation(project(":react-native-encrypted-storage"))
  implementation(project(":react-native-fs"))
  implementation(project(":react-native-get-random-values"))
  implementation(project(":react-native-gesture-handler"))

  implementation(project(":react-native-keychain"))
  implementation(project(":react-native-safe-area-context"))
  implementation(project(":react-native-screens"))
  implementation(project(":react-native-svg"))
  // ----------------------------------------------------------------------

  // Your app deps
  implementation("androidx.appcompat:appcompat:1.7.0")
  implementation("com.google.android.material:material:1.12.0")
}
